<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventKita - Discover Amazing Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <div class="w-full max-w-md bg-slate-900 p-8 rounded-2xl shadow-2xl border border-slate-800">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-blue-600 text-white flex items-center justify-center rounded-xl font-bold text-xl mx-auto mb-4 shadow-lg shadow-blue-500/50">A</div>
            <h1 class="text-2xl font-extrabold text-white">Admin Portal</h1>
            <p class="text-sm text-slate-400 mt-1">Masuk untuk mengelola event.</p>
        </div>

        <div id="error-message" class="hidden bg-red-500/10 text-red-400 p-4 rounded-lg mb-6 text-sm border border-red-500/20 text-center"></div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Username</label>
                <input type="text" id="username" class="w-full bg-slate-800 border border-slate-700 text-white px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="admin" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" id="password" class="w-full bg-slate-800 border border-slate-700 text-white px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-500 transition-colors shadow-lg shadow-blue-600/30 mt-2">
                Login as Admin
            </button>
        </form>
        
        <p class="text-center text-sm text-slate-400 mt-6">
            Kembali ke user? <a href="user-login.html" class="text-blue-400 font-semibold hover:text-blue-300">Login User</a>
        </p>
    </div>

    <div id="footer-placeholder"></div>

    <script src="config.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');
            const errorDiv = document.getElementById('error-message');

            btn.innerHTML = 'Memproses...';
            btn.disabled = true;
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch(`${API_URL}?action=loginAdmin&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
                const text = await response.text();
                const data = JSON.parse(text.replace(/^\)\]\}'\n/, ''));

                if (data.status === 'success') {
                    // Simpan sesi login admin ke localStorage
                    localStorage.setItem('admin_session', JSON.stringify(data.admin));
                    window.location.href = 'dashboard-admin.html';
                } else {
                    errorDiv.innerText = data.message;
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.innerText = "Terjadi kesalahan sistem.";
                errorDiv.classList.remove('hidden');
            } finally {
                btn.innerHTML = 'Login as Admin';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
