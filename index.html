<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventKita - Discover Amazing Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col"></body>

    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="flex-grow w-full">
        <div class="max-w-7xl mx-auto mt-8 px-4 sm:px-6 lg:px-8 pb-16">
            
            <!-- Hero Section -->
            <div class="relative bg-slate-900 rounded-3xl overflow-hidden shadow-xl mb-12">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-900 to-indigo-900"></div>
                <div class="relative z-10 flex flex-col items-center justify-center min-h-[300px] md:min-h-[400px] text-center px-4 py-12">
                    <h1 class="text-3xl md:text-5xl font-extrabold text-white mb-4 tracking-tight">Discover Amazing Events</h1>
                    <p class="text-base md:text-lg text-slate-300 mb-8 max-w-2xl mx-auto">Temukan pengalaman tak terlupakan. Daftar sekarang dan jadilah bagian dari event-event spektakuler di sekitarmu.</p>
                    <a href="#upcoming" class="bg-white text-slate-900 px-8 py-3 rounded-full font-bold shadow-lg hover:bg-blue-50 transition-transform duration-200">
                        Browse All Events
                    </a>
                </div>
            </div>

            <!-- Upcoming Events -->
            <div id="upcoming" class="mb-8">
                <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Upcoming Events</h2>
                <p class="text-slate-500 mt-1 text-sm md:text-base">Jangan lewatkan event terdekat kami.</p>
            </div>

            <!-- Grid Event -->
            <div id="event-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                <!-- Loading state -->
                <div class="col-span-full text-center py-12 text-slate-500">
                    <svg class="animate-spin h-8 w-8 mx-auto text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Memuat event...
                </div>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="config.js"></script>
    <script>
        // Fungsi untuk mengambil data event dari Google Sheets
        async function fetchEvents() {
            try {
                // Panggil fungsi getEvents() di Apps Script
                const response = await fetch(`${API_URL}?action=getEvents`);
                const text = await response.text();
                
                // Apps Script terkadang mengembalikan prefix anti-XSSI, kita bersihkan dulu
                const cleanJson = text.replace(/^\)\]\}'\n/, '');
                const events = JSON.parse(cleanJson);

                renderEvents(events);
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('event-container').innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500">
                        Gagal memuat data event. Pastikan API URL benar dan Web App di-deploy sebagai "Anyone".
                    </div>
                `;
            }
        }

        // Fungsi untuk menampilkan kartu event ke dalam HTML
        function renderEvents(events) {
            const container = document.getElementById('event-container');
            
            if (events.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-lg">Belum ada event yang tersedia saat ini.</div>`;
                return;
            }

            let html = '';
            events.forEach(event => {
                // Format tanggal
                const date = new Date(event.tanggal_mulai).toLocaleDateString('id-ID', {
                    day: 'numeric', month: 'short', year: 'numeric'
                });
                
                // Format harga
                const price = event.harga == 0 ? 'Gratis' : 'Rp ' + parseInt(event.harga).toLocaleString('id-ID');
                
                // Gambar (jika kosong pakai placeholder)
                const imageSrc = event.poster ? event.poster : 'https://via.placeholder.com/400x200?text=No+Image';

                html += `
                <div class="bg-white rounded-2xl p-4 shadow-sm hover:shadow-xl transition-shadow duration-300 border border-slate-100 flex flex-col">
                    <div class="h-48 bg-slate-200 rounded-xl mb-4 relative overflow-hidden">
                        <img src="${imageSrc}" class="w-full h-full object-cover" alt="${event.judul}">
                        <div class="absolute top-3 left-3 bg-white px-3 py-1 rounded-full text-xs font-bold text-slate-800 shadow-sm uppercase">
                            ${event.status}
                        </div>
                    </div>
                    <h3 class="font-bold text-lg md:text-xl text-slate-900 mb-1 line-clamp-1">${event.judul}</h3>
                    <div class="text-sm text-slate-500 space-y-1 mb-5 mt-auto">
                        <p class="flex items-center gap-2">📅 ${date}</p>
                        <p class="flex items-center gap-2">📍 ${event.lokasi}</p>
                        <p class="flex items-center gap-2">🎟️ ${price}</p>
                    </div>
                    <!-- Tombol arahkan ke detail event (sementara passing slug via URL) -->
                    <a href="detail.html?slug=${event.slug}" class="block text-center bg-blue-50 text-blue-700 font-bold py-2.5 rounded-xl hover:bg-blue-600 hover:text-white transition-colors mt-auto">View Details</a>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        // Jalankan fungsi saat halaman dimuat
        document.addEventListener('DOMContentLoaded', fetchEvents);
    </script>
</body>
</html>
