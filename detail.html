<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventKita - Discover Amazing Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto mt-10 px-4 sm:px-6 lg:px-8 pb-16 w-full">
        <a href="index.html" class="text-slate-500 hover:text-slate-800 text-sm font-medium mb-6 inline-flex items-center gap-2">
            &larr; Kembali ke Daftar Event
        </a>

        <div id="event-detail-container" class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden flex flex-col md:flex-row">
            <div class="col-span-full p-10 text-center text-slate-500">Memuat detail event...</div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="config.js"></script>
    <script>
        const userSession = JSON.parse(localStorage.getItem('user_session'));

        // Ubah tampilan navbar jika login
        if (userSession) {
            document.getElementById('nav-dash').classList.remove('hidden');
            document.getElementById('nav-log').classList.add('hidden');
        }

        // Ambil slug dari URL (?slug=...)
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');

        async function fetchEventDetail() {
            if (!slug) {
                document.getElementById('event-detail-container').innerHTML = `<p class="p-8 text-center text-red-500">Event tidak ditemukan.</p>`;
                return;
            }

            try {
                const response = await fetch(`${API_URL}?action=getEvents`);
                const text = await response.text();
                const events = JSON.parse(text.replace(/^\)\]\}'\n/, ''));
                
                const event = events.find(e => e.slug === slug);
                if (!event) {
                    document.getElementById('event-detail-container').innerHTML = `<p class="p-8 text-center text-red-500">Event tidak ditemukan.</p>`;
                    return;
                }

                renderDetail(event);
            } catch (error) {
                console.error(error);
            }
        }

        function renderDetail(event) {
            const container = document.getElementById('event-detail-container');
            const dateStart = new Date(event.tanggal_mulai).toLocaleString('id-ID', { dateStyle: 'full', timeStyle: 'short' });
            const price = event.harga == 0 ? 'Gratis' : 'Rp ' + parseInt(event.harga).toLocaleString('id-ID');
            const imageSrc = event.poster ? event.poster : 'https://via.placeholder.com/600x400?text=No+Image';

            // Cek apakah tombol daftar perlu ditampilkan (jika user login)
            let actionButton = '';
            if (userSession) {
                actionButton = `<button onclick="daftarEvent(${event.id})" id="btn-daftar" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-slate-800 transition-colors shadow-lg text-lg">Daftar Sekarang</button>`;
            } else {
                actionButton = `<a href="user-login.html" class="block text-center w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-slate-800 transition-colors shadow-lg text-lg">Login untuk Mendaftar</a>`;
            }

            container.innerHTML = `
                <!-- Kiri: Gambar -->
                <div class="w-full md:w-1/2 bg-slate-100 relative min-h-[250px] md:min-h-[400px]">
                    <img src="${imageSrc}" class="absolute inset-0 w-full h-full object-cover" alt="${event.judul}">
                </div>

                <!-- Kanan: Detail -->
                <div class="w-full md:w-1/2 p-6 md:p-10 flex flex-col justify-between">
                    <div>
                        <h1 class="text-3xl font-extrabold text-slate-900 mb-2">${event.judul}</h1>
                        <p class="text-blue-600 font-bold text-lg mb-6">${price}</p>

                        <div class="space-y-4 mb-8 text-slate-700">
                            <div class="flex items-start gap-4">
                                <span class="text-2xl">📅</span>
                                <div>
                                    <p class="font-semibold text-slate-900">Tanggal & Waktu</p>
                                    <p class="text-sm">${dateStart} WIB</p>
                                </div>
                            </div>
                            <div class="flex items-start gap-4">
                                <span class="text-2xl">📍</span>
                                <div>
                                    <p class="font-semibold text-slate-900">Lokasi</p>
                                    <p class="text-sm">${event.lokasi}</p>
                                </div>
                            </div>
                            <div class="flex items-start gap-4">
                                <span class="text-2xl">👥</span>
                                <div>
                                    <p class="font-semibold text-slate-900">Kuota Tersedia</p>
                                    <p class="text-sm">${event.kuota} Peserta</p>
                                </div>
                            </div>
                        </div>

                        <div class="border-t border-slate-200 pt-6 mb-8">
                            <h3 class="font-bold text-slate-900 mb-2">Tentang Event</h3>
                            <p class="text-slate-600 text-sm leading-relaxed">${event.deskripsi}</p>
                        </div>
                    </div>

                    <div id="action-area">
                        ${actionButton}
                    </div>
                </div>
            `;
        }

        // Fungsi untuk mendaftar event
        async function daftarEvent(eventId) {
            const btn = document.getElementById('btn-daftar');
            btn.innerHTML = 'Memproses...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}?action=daftarEvent&userId=${userSession.id}&eventId=${eventId}`);
                const text = await response.text();
                const data = JSON.parse(text.replace(/^\)\]\}'\n/, ''));

                if (data.status === 'success') {
                    alert("Pendaftaran Berhasil! Kode Registrasi: " + data.kode);
                    window.location.href = 'dashboard-user.html';
                } else {
                    alert(data.message);
                    btn.innerHTML = 'Daftar Sekarang';
                    btn.disabled = false;
                }
            } catch (error) {
                alert("Gagal mendaftar. Coba lagi.");
                btn.innerHTML = 'Daftar Sekarang';
                btn.disabled = false;
            }
        }

        fetchEventDetail();
    </script>
</body>
</html>
