<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventKita - Discover Amazing Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="flex-grow max-w-3xl mx-auto mt-10 px-4 w-full pb-16">
        <div class="mb-6 flex items-center gap-4">
            <a href="dashboard-admin.html" class="text-slate-500 hover:text-slate-800">&larr; Kembali</a>
            <h1 class="text-2xl font-extrabold text-slate-900">Create Event</h1>
        </div>

        <div id="error-message" class="hidden bg-red-50 text-red-600 p-4 rounded-xl mb-6 text-sm border border-red-100"></div>

        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
            <form id="eventForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Event Title</label>
                    <input type="text" id="judul" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Description</label>
                    <textarea id="deskripsi" rows="4" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Location</label>
                    <input type="text" id="lokasi" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Start Date & Time</label>
                        <input type="datetime-local" id="tanggal_mulai" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">End Date & Time</label>
                        <input type="datetime-local" id="tanggal_selesai" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Quota (Peserta)</label>
                        <input type="number" id="kuota" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required min="1">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Price (Rp)</label>
                        <input type="number" id="harga" value="0" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required min="0">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Poster URL (Opsional)</label>
                    <input type="url" id="poster" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://contoh.com/gambar.jpg">
                    <p class="text-xs text-slate-500 mt-1">Masukkan link gambar (bisa dari Google Images).</p>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Status</label>
                    <select id="status" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="publish">Publish (Tampilkan ke User)</option>
                        <option value="draft">Draft (Simpan Sementara)</option>
                    </select>
                </div>
                <div class="flex gap-4 pt-4 border-t">
                    <button type="submit" id="btn-submit" class="bg-blue-600 text-white font-bold px-8 py-3 rounded-lg hover:bg-blue-700 transition-colors shadow-md">Save Event</button>
                    <a href="dashboard-admin.html" class="bg-slate-100 text-slate-700 font-bold px-8 py-3 rounded-lg hover:bg-slate-200 transition-colors">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="config.js"></script>
    <script>
        const adminSession = JSON.parse(localStorage.getItem('admin_session'));

        if (!adminSession) {
            window.location.href = 'admin-login.html';
        }

        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.innerHTML = 'Menyimpan...';
            btn.disabled = true;
            document.getElementById('error-message').classList.add('hidden');

            const payload = {
                admin_id: adminSession.id,
                judul: document.getElementById('judul').value,
                deskripsi: document.getElementById('deskripsi').value,
                lokasi: document.getElementById('lokasi').value,
                tanggal_mulai: document.getElementById('tanggal_mulai').value,
                tanggal_selesai: document.getElementById('tanggal_selesai').value,
                kuota: document.getElementById('kuota').value,
                harga: document.getElementById('harga').value,
                poster: document.getElementById('poster').value,
                status: document.getElementById('status').value
            };

            try {
                // Kirim data via POST
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'createEvent', data: payload })
                });
                const text = await response.text();
                const data = JSON.parse(text.replace(/^\)\]\}'\n/, ''));

                if (data.status === 'success') {
                    alert('Event berhasil dibuat!');
                    window.location.href = 'dashboard-admin.html';
                } else {
                    const err = document.getElementById('error-message');
                    err.innerText = data.message;
                    err.classList.remove('hidden');
                }
            } catch (error) {
                const err = document.getElementById('error-message');
                err.innerText = "Terjadi kesalahan sistem.";
                err.classList.remove('hidden');
            } finally {
                btn.innerHTML = 'Save Event';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
